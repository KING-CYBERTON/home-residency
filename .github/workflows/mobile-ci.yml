name: Mobile CI

on:
  pull_request:
    paths: ["mobile/**", "backend/api/openapi.yaml", ".github/workflows/mobile-ci.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "backend/api/openapi.yaml", ".github/workflows/mobile-ci.yml"]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format -l 120 --output=none --set-exit-if-changed apps packages
      - run: flutter analyze
      # Includes the check that every API call matches backend/api/openapi.yaml.
      - run: flutter test
        working-directory: mobile/packages/homend_core
      - run: flutter test
        working-directory: mobile/apps/provider
      - run: flutter test
        working-directory: mobile/apps/client

  build:
    name: Build Android debug APKs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: mobile/apps/client
      - run: flutter build apk --debug
        working-directory: mobile/apps/provider
