name: Mobile CI

# Called by ci.yml when mobile/ or the OpenAPI contract changes.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format -l 120 --output=none --set-exit-if-changed apps packages
      - run: flutter analyze
      # Includes the check that every API call matches backend/api/openapi.yaml.
      - run: flutter test
        working-directory: mobile/packages/homend_core
      - run: flutter test
        working-directory: mobile/apps/provider
      - run: flutter test
        working-directory: mobile/apps/client

  build:
    name: Build Android debug APKs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: mobile/apps/client
      - run: flutter build apk --debug
        working-directory: mobile/apps/provider
      # Proves the release signing set-up in build.gradle.kts with a throwaway key, so the Play
      # upload in mobile-release.yml does not find a broken release build first.
      - name: Build signed release bundles with a throwaway key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-pass -keypass ci-pass \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ci.jks" ANDROID_KEYSTORE_PASSWORD=ci-pass \
            ANDROID_KEY_ALIAS=ci ANDROID_KEY_PASSWORD=ci-pass
          for app in client provider; do
            (cd apps/$app && flutter build appbundle --release --dart-define=API_BASE_URL=https://api.invalid/api/v1)
            jarsigner -verify -verbose -certs apps/$app/build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/$app-sig.txt"
            grep -q "CN=CI" "$RUNNER_TEMP/$app-sig.txt"
          done
