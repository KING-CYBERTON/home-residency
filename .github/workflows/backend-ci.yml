name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/homend_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w ."; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Tests (unit and end-to-end against Postgres, with contract validation)
        run: go test -race -count=1 ./...

  generated-code:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Regenerate from openapi.yaml
        working-directory: backend
        run: go generate ./...
      - name: Fail if the committed output differs
        run: git diff --exit-code -- backend/internal/api/gen || { echo "::error::api.gen.go is stale. Run 'make generate' in backend/ and commit."; exit 1; }

  web-css:
    name: Tailwind CSS is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild internal/web/static/css/app.css
        working-directory: backend
        run: make css
      - name: Fail if the committed CSS differs
        run: git diff --exit-code -- backend/internal/web/static/css || { echo "::error::app.css is stale. Run 'make css' in backend/ and commit."; exit 1; }

  openapi:
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Redocly lint
        run: npx --yes @redocly/cli@1.25.0 lint api/openapi.yaml --format=stylish

  migrations:
    name: Migrations apply, roll back and re-apply
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/homend?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go run ./cmd/api migrate up
      - name: Roll everything back (every Down block must work)
        run: go run ./cmd/api migrate reset
      - run: go run ./cmd/api migrate up
      - run: go run ./cmd/api migrate status

  vulncheck:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          go-package: ./...
          work-dir: backend

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: homend-api:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
