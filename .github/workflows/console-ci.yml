name: Console CI

# Called by ci.yml when console/ or the OpenAPI contract changes.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: console

jobs:
  build:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      # The API types, role map and enums are generated from backend/api/openapi.yaml.
      # A contract change without regenerating fails here, not in production.
      - name: Generated API code is current
        run: |
          npm run generate
          git diff --exit-code -- src/api || (echo "Run 'npm run generate' in console/ and commit the result" && exit 1)
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: console/dist
          retention-days: 7
