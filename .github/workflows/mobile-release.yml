name: Mobile release

# Called by ci.yml once every check passed on a merge to main that changes mobile/. Builds:
#   - staging APKs of both apps against the staging API, kept as run artifacts for testers
#     (when MOBILE_STAGING_API_BASE_URL is set), and
#   - signed release bundles against the production API, uploaded to the Google Play internal
#     testing track. Promote a tested build to production with mobile-promote.yml.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging APK (${{ matrix.app }})
    if: vars.MOBILE_STAGING_API_BASE_URL != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, provider]
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      # No upload key here, so Gradle signs with the debug key: install by sideloading, after
      # removing any Play build of the same app.
      - name: Build against the staging API
        env:
          API_BASE_URL: ${{ vars.MOBILE_STAGING_API_BASE_URL }}
        run: |
          flutter pub get
          flutter build apk --release --build-number=$(( ($(date +%s) - 1767225600) / 60 + 1000 )) --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: homend-${{ matrix.app }}-staging-apk
          path: mobile/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Upload ${{ matrix.app }} to Google Play
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: client
            package: ke.co.homendresidence.homend_client
          - app: provider
            package: ke.co.homendresidence.homend_provider
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    env:
      HAS_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Signing secrets and Play access are set
        if: env.HAS_SECRETS != 'true'
        working-directory: .
        run: |
          echo "::warning::Skipping the Play upload: set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets and the GCP_WORKLOAD_IDENTITY_PROVIDER and PLAY_SERVICE_ACCOUNT variables (see mobile/README.md)."
      - uses: actions/checkout@v7
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-java@v6
        if: env.HAS_SECRETS == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: env.HAS_SECRETS == 'true'
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Restore the upload key
        if: env.HAS_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      # The build number is minutes since 1 Jan 2026 (plus 1000), so it grows with every build
      # whether ci.yml or a manual run started it, and each upload has a new Play version code.
      - name: Build the release bundle
        if: env.HAS_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${{ vars.MOBILE_API_BASE_URL }}" ]; then
            echo "::error::Set the MOBILE_API_BASE_URL repository variable to the production API, e.g. https://api.example.co.ke/api/v1"
            exit 1
          fi
          flutter pub get
          flutter build appbundle --release \
            --build-number=$(( ($(date +%s) - 1767225600) / 60 + 1000 )) \
            --dart-define=API_BASE_URL=${{ vars.MOBILE_API_BASE_URL }}
      # No key is stored: GitHub's OIDC token is exchanged through Workload Identity Federation
      # for short-lived credentials of the Play service account (see mobile/README.md).
      - name: Sign in to Google Cloud (Workload Identity Federation)
        if: env.HAS_SECRETS == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v7
        if: env.HAS_SECRETS == 'true'
        with:
          python-version: "3.12"
      - name: Upload to the internal testing track
        if: env.HAS_SECRETS == 'true'
        working-directory: .
        env:
          PACKAGE: ${{ matrix.package }}
          BUNDLE: mobile/apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          # "draft" until the app has been released once in the Play Console, then "completed".
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          python -m pip install --quiet google-auth==2.38.0 requests==2.32.3
          python mobile/scripts/play.py upload "$PACKAGE" "$BUNDLE" --track internal --status "$STATUS" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
