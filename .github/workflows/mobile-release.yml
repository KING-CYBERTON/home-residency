name: Mobile release

# Every merge to main that changes mobile/ builds signed release bundles of both apps and uploads
# them to the Google Play internal testing track. Promote to production by hand in the Play Console.
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-release.yml"]
  workflow_dispatch:

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Upload ${{ matrix.app }} to Google Play
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: client
            package: ke.co.homendresidence.homend_client
          - app: provider
            package: ke.co.homendresidence.homend_provider
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    env:
      HAS_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Signing and Play secrets are set
        if: env.HAS_SECRETS != 'true'
        working-directory: .
        run: |
          echo "::warning::Skipping the Play upload: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and PLAY_SERVICE_ACCOUNT_JSON (see mobile/README.md)."
      - uses: actions/checkout@v7
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-java@v5
        if: env.HAS_SECRETS == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        if: env.HAS_SECRETS == 'true'
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Restore the upload key
        if: env.HAS_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      # The build number grows with every run, so each upload has a new Play version code.
      - name: Build the release bundle
        if: env.HAS_SECRETS == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${{ vars.MOBILE_API_BASE_URL }}" ]; then
            echo "::error::Set the MOBILE_API_BASE_URL repository variable to the production API, e.g. https://api.example.co.ke/api/v1"
            exit 1
          fi
          flutter pub get
          flutter build appbundle --release \
            --build-number=$((1000 + ${{ github.run_number }})) \
            --dart-define=API_BASE_URL=${{ vars.MOBILE_API_BASE_URL }}
      - name: Upload to the internal testing track
        if: env.HAS_SECRETS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package }}
          releaseFiles: mobile/apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          track: internal
          # "draft" until the app has been released once in the Play Console, then "completed".
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
