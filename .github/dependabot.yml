version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # Every codeql-action step must run the same version, so they move together.
      codeql: { patterns: ["github/codeql-action*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly }
    groups:
      console: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups:
      e2e: { patterns: ["*"], update-types: [minor, patch] }
