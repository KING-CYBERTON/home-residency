components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from /auth/*
    cookieAuth:
      type: apiKey
      in: cookie
      name: hr_session
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Token
      description: Shared secret per integration (Daraja uses a secret path segment + IP allow-list).
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from meta.next_cursor
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Retries with the same key return the original response.
  responses:
    E400:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: bad_request
            message: Malformed request
            request_id: 01J...
    E401:
      description: Not signed in or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthenticated
            message: Not signed in or session expired
            request_id: 01J...
    E403:
      description: Role not allowed, or segregation-of-duties rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Role not allowed, or segregation-of-duties rule
            request_id: 01J...
    E404:
      description: Not found or not visible to caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: Not found or not visible to caller
            request_id: 01J...
    E409:
      description: Illegal state transition or duplicate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_state_transition
            message: Illegal state transition or duplicate
            request_id: 01J...
    E410:
      description: Offer expired or already filled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: gone
            message: Offer expired or already filled
            request_id: 01J...
    E422:
      description: Validation or business rule failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rule_violation
            message: Validation or business rule failed
            request_id: 01J...
    E429:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rate_limited
            message: Too many attempts
            request_id: 01J...
    Edefault:
      description: Any other error (validation_failed, rule_violation, not_implemented, internal)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_failed
            message: Any other error (validation_failed, rule_violation, not_implemented, internal)
            request_id: 01J...
  schemas:
    UserKind:
