openapi: 3.0.3
info:
  title: Homend Residence Platform API
  version: 1.0.0-draft
  description: 'JSON REST API of the Go modular monolith (ADR-0001). Used by the React management console and the future Flutter
    apps. The server-rendered HTML portals call the same domain services, not this API over HTTP, but every portal action
    has a JSON equivalent here.


    **Conventions**

    - Base path `/api/v1`. JSON bodies, snake_case fields, UUID ids, RFC 3339 UTC timestamps.

    - Money is integer KES minor units in fields ending `_minor`.

    - Lists are cursor-paginated: `?limit=25&cursor=...` → `{data, meta:{next_cursor}}`.

    - Auth: `Authorization: Bearer <token>` or the `hr_session` cookie (HTML portals, with CSRF token).

    - `/console/*` needs a staff session that has passed TOTP; `x-roles` lists the roles allowed.

    - State-changing money endpoints accept `Idempotency-Key`.

    - Errors use one envelope: `{code, message, details, request_id}`. Business-rule failures are 422 `rule_violation`; illegal
    state changes are 409 `invalid_state_transition`.

    - Clients and providers never see each other''s phone numbers, emails or ID numbers.'
servers:
- url: https://api.homendresidence.co.ke/api/v1
  description: Production (placeholder domain)
- url: http://localhost:8080/api/v1
  description: Local
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: System
  description: Health
- name: Auth
  description: Sign-in for clients and providers (phone + OTP) and staff (email + password + TOTP).
- name: Public
  description: 'Unauthenticated data for the public website: catalogue, rate card, content, leads.'
- name: Documents
  description: Encrypted document vault. Uploads go straight to S3 with presigned URLs.
- name: Notifications
  description: In-app inbox and PWA web push registration.
- name: Messaging
  description: Management-mediated messages (Could-have). Client and provider never message each other.
- name: Client
  description: 'Household portal: addresses, requests, shortlist choice, rating, payment, complaints.'
- name: Provider
  description: 'Provider portal: applications, documents, contract, availability, offers, check-in, earnings.'
- name: 'Console: Dashboard'
  description: Management console
- name: 'Console: Vetting'
  description: Report §5.1 steps 2-7
- name: 'Console: Compliance'
  description: Document expiry, re-verification, vault access log
- name: 'Console: Providers'
  description: Provider file, activation, suspension
- name: 'Console: Training'
  description: Induction, category training and retraining
- name: 'Console: Triage'
  description: 'Report §5.2: queue, shortlist, assignment, visits, variations, exceptions'
- name: 'Console: Clients'
  description: Household accounts and ID verification
- name: 'Console: Complaints'
  description: 'Report §5.4: cases, investigation, disciplinary ladder, disqualification'
- name: 'Console: Quality'
  description: Supervisor spot checks
- name: 'Console: Finance'
  description: Invoices, payments, refunds, payouts, ledger, reconciliation
- name: 'Console: Catalogue'
  description: Categories, services, rate card, checklists, service areas, plans
- name: 'Console: Content'
  description: Public site pages, FAQs, notification templates
- name: 'Console: Admin'
  description: Staff, roles, settings, audit log, leads
- name: 'Console: Reports'
  description: Report §10 metrics
- name: Webhooks
  description: Inbound callbacks from Safaricom Daraja, USSD/SMS gateway and WhatsApp
paths:
  /healthz:
    get:
      tags:
      - System
      summary: Liveness and database check
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  db:
                    type: boolean
                  version:
                    type: string
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/otp/request:
    post:
      tags:
      - Auth
      summary: Request an SMS/WhatsApp one-time code
      operationId: postAuthOtpRequest
      description: Clients and providers. Rate limited per phone and IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResult'
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify a code and sign in or register
      operationId: postAuthOtpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Create a household or provider account with email and password
      operationId: postAuthRegister
      description: The alternative to phone sign-up for when SMS is not available. Signs the new account in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRegister'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Household or provider email and password sign-in
      operationId: postAuthLogin
      description: Staff use /auth/staff/login. Ten wrong passwords lock the account for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/password/forgot:
    post:
      tags:
      - Auth
      summary: Email a password reset link
      operationId: postAuthPasswordForgot
      description: Always answers 204, whether or not the email has an account, so it cannot be used to find accounts. Households and providers only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgot'
      security: []
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/password/reset:
    post:
      tags:
      - Auth
      summary: Set a new password with the token from a reset link
      operationId: postAuthPasswordReset
      description: The token works once and for one hour. Signs out every other session and confirms the email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      security: []
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /me/password:
    post:
      tags:
      - Auth
      summary: Set or change your own password
      operationId: postMePassword
      description: current_password is required when the account already has a password. Needs an email address on the account. Signs out every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/staff/login:
    post:
      tags:
      - Auth
      summary: Staff email and password sign-in
      operationId: postAuthStaffLogin
      description: Returns a session with mfa_required=true; call /auth/staff/mfa before using console endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/staff/mfa:
    post:
      tags:
      - Auth
      summary: Complete staff TOTP challenge
      operationId: postAuthStaffMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the current session
      operationId: postAuthLogout
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        default:
          $ref: '#/components/responses/Edefault'
  /me:
    get:
      tags:
      - Auth
      summary: Current user
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        default:
          $ref: '#/components/responses/Edefault'
    patch:
      tags:
      - Auth
      summary: Update own name, email or language
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        default:
          $ref: '#/components/responses/Edefault'
  /me/consents:
    post:
      tags:
      - Auth
      summary: Record consent decisions
      operationId: postMeConsents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ConsentInput'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        default:
          $ref: '#/components/responses/Edefault'
  /public/service-areas:
    get:
      tags:
      - Public
      summary: Active service areas
      operationId: getPublicServiceAreas
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceArea'
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /public/categories:
    get:
      tags:
      - Public
      summary: Active service categories
      operationId: getPublicCategories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /public/categories/{slug}:
    get:
      tags:
      - Public
      summary: Category with its services and current prices
      operationId: getPublicCategoriesById
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  faqs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Faq'
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /public/rate-card:
    get:
      tags:
      - Public
      summary: Published rate card
      operationId: getPublicRateCard
      description: Each service carries current_price for the given area (or the default price).
      parameters:
      - name: service_area_id
        in: query
        schema:
          type: string
          format: uuid
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /public/subscription-plans:
    get:
      tags:
      - Public
      summary: Active household subscription plans
      operationId: getPublicSubscriptionPlans
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /public/pages/{slug}:
    get:
      tags:
      - Public
      summary: Published content page
      operationId: getPublicPagesById
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: lang
        in: query
        schema:
          $ref: '#/components/schemas/Language'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPage'
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /public/faqs:
    get:
      tags:
      - Public
      summary: Published FAQs
      operationId: getPublicFaqs
      parameters:
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
      - name: lang
        in: query
        schema:
          $ref: '#/components/schemas/Language'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faq'
        '400':
          $ref: '#/components/responses/E400'
        default:
          $ref: '#/components/responses/Edefault'
  /public/leads:
    post:
      tags:
      - Public
      summary: Submit an enquiry from the public site
      operationId: postPublicLeads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadInput'
      security: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        default:
          $ref: '#/components/responses/Edefault'
  /documents/uploads:
    post:
      tags:
      - Documents
      summary: Create a document and get a presigned upload URL
      operationId: postDocumentsUploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        default:
          $ref: '#/components/responses/Edefault'
  /documents/{id}/complete:
    post:
      tags:
      - Documents
      summary: Confirm the upload finished
      operationId: postDocumentsComplete
      description: Server checks the object exists, size and content type match, then marks it uploaded.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        default:
          $ref: '#/components/responses/Edefault'
  /documents/{id}:
    get:
      tags:
      - Documents
      summary: Document metadata
      operationId: getDocumentsById
      description: Owner, or staff with vetting_officer, approver, compliance, supervisor or complaints_manager.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        default:
          $ref: '#/components/responses/Edefault'
  /documents/{id}/download-url:
    get:
      tags:
      - Documents
      summary: Short-lived download link (logged)
      operationId: getDocumentsDownloadUrl
      parameters:
      - $ref: '#/components/parameters/id'
      - name: purpose
        in: query
        schema:
          type: string
        description: Required for staff; written to the access log
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        default:
          $ref: '#/components/responses/Edefault'
  /notifications:
    get:
      tags:
      - Notifications
      summary: In-app notifications
      operationId: getNotifications
      parameters:
      - name: unread
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        default:
          $ref: '#/components/responses/Edefault'
  /notifications/{id}/read:
    post:
      tags:
      - Notifications
      summary: Mark one notification read
      operationId: postNotificationsRead
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        default:
          $ref: '#/components/responses/Edefault'
  /notifications/read-all:
    post:
      tags:
      - Notifications
      summary: Mark all notifications read
      operationId: postNotificationsReadAll
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        default:
          $ref: '#/components/responses/Edefault'
  /push-subscriptions:
    post:
      tags:
      - Notifications
      summary: Register a web push subscription (PWA)
      operationId: postPushSubscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '204':
