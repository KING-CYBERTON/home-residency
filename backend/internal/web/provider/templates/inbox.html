{{define "inbox"}}{{with .Data}}
<section class="mx-auto max-w-xl px-4 py-5">
  {{template "top" .}}
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold text-slate-900">Messages</h1>
    {{if .V}}<form method="post" action="/provider/inbox/read-all"><button type="submit" class="text-sm font-medium text-brand-700">Mark all read</button></form>{{end}}
  </div>
  <ul class="mt-4 divide-y divide-slate-200 rounded-xl border border-slate-200 bg-white">
    {{range .V}}
    <li class="px-4 py-3{{if not .ReadAt}} bg-brand-50{{end}}">
      {{with .Title}}<p class="font-medium">{{.}}</p>{{end}}
      <p class="text-sm text-slate-700">{{.Body}}</p>
      <p class="mt-1 text-xs text-slate-500">{{when .CreatedAt}}</p>
    </li>
    {{else}}<li class="px-4 py-3 text-sm text-slate-600">No messages.</li>{{end}}
  </ul>
</section>
{{end}}{{end}}
