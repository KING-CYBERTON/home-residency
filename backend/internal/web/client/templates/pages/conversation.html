{{define "page"}}
<a href="{{.Base}}/messages" class="text-sm text-brand-700">← Messages</a>
<div id="thread" class="mt-3" hx-get="{{.Base}}/messages/{{.Data.ID}}?poll=1" hx-trigger="every 15s" hx-swap="innerHTML">{{template "thread" .}}</div>
<form method="post" action="{{.Base}}/messages/{{.Data.ID}}" class="sticky bottom-20 mt-4 flex gap-2 bg-slate-50 py-2">
  
  <textarea name="body" rows="2" required maxlength="2000" placeholder="Write a message" class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
  <button class="rounded-lg bg-brand-700 px-4 font-medium text-white">Send</button>
</form>
{{end}}

{{define "thread"}}
<ul class="space-y-2">
{{range .Data.Messages}}
  <li class="flex {{if val .FromManagement}}justify-start{{else}}justify-end{{end}}">
    <div class="max-w-[85%] rounded-2xl px-3 py-2 text-sm {{if val .FromManagement}}bg-white border border-slate-200{{else}}bg-brand-700 text-white{{end}}">
      <p class="whitespace-pre-line">{{.Body}}</p>
      <p class="mt-1 text-[11px] {{if val .FromManagement}}text-slate-500{{else}}text-brand-100{{end}}">{{if val .FromManagement}}Homend · {{end}}{{when .CreatedAt}}</p>
    </div>
  </li>
{{else}}
  <li>{{template "empty" "No messages yet."}}</li>
{{end}}
</ul>
{{end}}
