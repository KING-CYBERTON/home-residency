{{define "page"}}
{{template "h1" "Report a problem"}}
<p class="-mt-2 mb-4 text-sm text-slate-600">Our quality team reads every report. If anyone is in danger right now, call 999 or 112 first.</p>
{{with .Data}}
<form method="post" action="{{$.Base}}/complaints" class="space-y-5">
  
  <fieldset>
    <legend class="text-sm font-medium">What happened?</legend>
    <div class="mt-2 grid grid-cols-2 gap-2 text-sm">
      {{range $k := list "quality" "conduct" "loss" "safeguarding"}}
      <label class="cursor-pointer rounded-lg border border-slate-300 bg-white p-3 has-[:checked]:border-brand-600 has-[:checked]:ring-1 has-[:checked]:ring-brand-600">
        <input type="radio" name="severity" value="{{$k}}" {{if eq $k $.Data.Severity}}checked{{end}} required class="sr-only">{{label $k}}
      </label>{{end}}
    </div>
  </fieldset>
  <label class="block">
    <span class="text-sm font-medium">Which booking? <span class="font-normal text-slate-500">(optional)</span></span>
    <select name="request_id" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-3">
      <option value="">Not about a booking</option>
      {{range .Requests}}<option value="{{.Id}}" {{if eq (print .Id) $.Data.RequestID}}selected{{end}}>{{.Reference}} · {{.Service.Name}} · {{day .RequestedStart}}</option>{{end}}
    </select>
  </label>
  <label class="block">
    <span class="text-sm font-medium">In one sentence</span>
    <input name="summary" value="{{.Summary}}" required minlength="5" maxlength="200" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-3">
  </label>
  <label class="block">
    <span class="text-sm font-medium">Details <span class="font-normal text-slate-500">(only our quality team sees these)</span></span>
    <textarea name="details" rows="5" maxlength="5000" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2">{{.Details}}</textarea>
  </label>
  <div>
    <span class="text-sm font-medium">Photos <span class="font-normal text-slate-500">(optional)</span></span>
    <input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" data-upload="other" data-target="#evidence"
           class="mt-1 block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-slate-100 file:px-3 file:py-2">
    <p data-upload-status class="mt-1 text-xs text-slate-500"></p>
    <input type="hidden" id="evidence" name="evidence" data-many>
  </div>
  <button class="w-full rounded-lg bg-brand-700 px-4 py-3 font-medium text-white">Send report</button>
</form>
{{end}}
{{end}}
